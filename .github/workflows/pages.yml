# Builds the game and publishes it to GitHub Pages on every push to dev.
# The public site plays no music at all (owner's decision, 2026-11-10). The owner's placeholder songs are never in the
# repo, and the game's own tracks under public/audio/ost are kept out of the published build: both lists are emptied here
# and the track files are removed before the build. Local builds are unaffected. See docs/notes/audio.md, "Music".
name: Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No music on the public site
        run: |
          echo '{"menu":[],"easy":[],"hard":[]}' > public/audio/music/manifest.json
          echo '{"menu":[],"easy":[],"hard":[]}' > public/audio/ost/manifest.json
          find public/audio/ost -type f ! -name manifest.json -delete
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
