# Builds the game and publishes it to GitHub Pages on every push to dev.
# The owner's placeholder songs are never in the repo, so their list is emptied here and the site plays only the game's
# own soundtrack, which is committed under public/audio/ost with its own manifest. See docs/notes/audio.md, "Music".
name: Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No placeholder songs on the public site
        run: echo '{"menu":[],"easy":[],"hard":[]}' > public/audio/music/manifest.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
